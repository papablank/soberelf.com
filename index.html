<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sober Elf</title>

  <style>
    :root {
      --burgundy: #461b24;
      --burgundy-dark: #291015;
      --leather: #35141b;
      --oak: #8a6545;
      --cream: #eadcc4;
      --muted: #bca991;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--cream);

      font-family: Georgia, "Times New Roman", serif;

      /* Deep burgundy leather */
      background:
        radial-gradient(
          ellipse at 50% 40%,
          rgba(125, 63, 55, 0.28) 0%,
          rgba(70, 27, 36, 0.10) 38%,
          transparent 72%
        ),
        radial-gradient(
          ellipse at 20% 80%,
          rgba(135, 92, 55, 0.10),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          #291015 0%,
          #461b24 45%,
          #321219 100%
        );

      position: relative;
      overflow: hidden;
    }

    /* Very subtle leather grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;

      opacity: 0.16;
      pointer-events: none;

      background:
        repeating-radial-gradient(
          circle at 0 0,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 4px
        );

      mix-blend-mode: overlay;
    }

    /* Soft edge darkening */
    body::after {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;

      box-shadow:
        inset 0 0 180px rgba(0, 0, 0, 0.55),
        inset 0 0 35px rgba(0, 0, 0, 0.35);
    }

    .container {
      width: min(900px, 90%);
      padding: 60px 30px;
      text-align: center;

      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 24px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;

      color: var(--oak);
    }

    h1 {
      margin: 0;

      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.85;
      letter-spacing: 0.045em;
      font-weight: 900;

      color: var(--cream);

      /* Slightly pressed / embossed feel */
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08),
        0 -1px 0 rgba(0, 0, 0, 0.30),
        0 5px 12px rgba(0, 0, 0, 0.35);
    }

    .rule {
      width: 70px;
      height: 1px;

      margin: 38px auto 30px;

      background: var(--oak);
      opacity: 0.65;
    }

    .tagline {
      margin: 0 auto;

      max-width: 620px;

      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.75;

      color: var(--muted);
    }

    .status {
      margin-top: 42px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;

      color: var(--oak);
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        letter-spacing: 0.02em;
      }

      .tagline br {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <p class="eyebrow">Independent Film &amp; Animation</p>

    <h1>sober elf</h1>

    <div class="rule"></div>

    <p class="tagline">
      Stories about recovery, transformation,<br>
      and being human.
    </p>

  </main>

</body>
</html>
